<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Carrier & Broker Appetite Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090d16;
    --card-bg: #111827;
    --card-border: #1f2937;
    --card-border-hover: #38bdf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --primary-blue: #38bdf8;
    --primary-blue-hover: #0ea5e9;
    --badge-carrier-bg: rgba(56, 189, 248, 0.1);
    --badge-carrier-text: #38bdf8;
    --badge-broker-bg: rgba(245, 158, 11, 0.1);
    --badge-broker-text: #f59e0b;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    margin: 0;
    padding: 40px 20px;
    line-height: 1.5;
  }

  .container { max-width: 1240px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    padding: 32px 40px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.025em; }
  p.sub { color: #94a3b8; font-size: 14px; margin: 0; font-weight: 400; }
  
  .header-stats {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    color: #38bdf8;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.025em;
    text-transform: uppercase;
  }

  /* Navigation Tabs */
  .nav-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 14px;
  }

  .tab-btn {
    background: var(--card-bg);
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
    padding: 11px 22px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tab-btn:hover {
    color: #ffffff;
    border-color: rgba(56, 189, 248, 0.4);
  }

  .tab-btn.active {
    background: rgba(56, 189, 248, 0.14);
    color: var(--primary-blue);
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.12);
  }

  .tab-pill {
    font-size: 11px;
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 7px;
    border-radius: 99px;
    color: inherit;
  }

  .tab-section { display: none; }
  .tab-section.active { display: block; }

  .search-bar-wrapper {
    position: sticky;
    top: 20px;
    z-index: 100;
    background: rgba(17, 24, 39, 0.88);
    backdrop-filter: blur(12px);
    padding: 18px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--card-border);
    margin-bottom: 30px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1;
    min-width: 280px;
    padding: 13px 18px;
    font-size: 15px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: #090d16;
    color: var(--text-primary);
    transition: all 0.2s ease;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary-blue);
    background: #111827;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }

  select {
    padding: 13px 18px;
    font-size: 14px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: #090d16;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:focus { outline: none; border-color: var(--primary-blue); background: #111827; }

  .suppressed-banner {
    background: rgba(153, 27, 27, 0.15);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: #fca5a5;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .suppressed-banner strong { color: #ffffff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
    border-color: var(--card-border-hover);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 12px;
  }

  .carrier-title {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    margin: 0;
    letter-spacing: -0.015em;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .badge-carrier { background: var(--badge-carrier-bg); color: var(--badge-carrier-text); border: 1px solid rgba(56, 189, 248, 0.2); }
  .badge-broker { background: var(--badge-broker-bg); color: var(--badge-broker-text); border: 1px solid rgba(245, 158, 11, 0.2); }

  .lines-text {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .lines-text strong { color: #e2e8f0; font-weight: 600; }

  /* Expandable Dropdowns */
  .uw-dropdown {
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: #090d16;
    overflow: hidden;
  }

  .uw-dropdown-toggle {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.02);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: #e2e8f0;
    text-align: left;
    transition: background 0.15s ease;
  }

  .uw-dropdown-toggle:hover { background: rgba(255, 255, 255, 0.05); }

  .uw-count-pill {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary-blue);
    background: rgba(56, 189, 248, 0.1);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .uw-dropdown-body {
    display: none;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    background: #090d16;
    border-top: 1px solid var(--card-border);
    max-height: 290px;
    overflow-y: auto;
  }

  .uw-dropdown-body.open { display: block; }

  .class-tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .class-tag {
    background: rgba(56, 189, 248, 0.07);
    border: 1px solid rgba(56, 189, 248, 0.18);
    color: #cbd5e1;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    line-height: 1.35;
  }

  .class-tag code {
    color: var(--primary-blue);
    font-family: 'Courier New', monospace;
    font-weight: 700;
  }

  .class-tag.matched {
    background: rgba(56, 189, 248, 0.28);
    border-color: var(--primary-blue);
    color: #ffffff;
    font-weight: 600;
  }

  .class-tag.matched code {
    color: #ffffff;
  }

  .uw-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }

  .uw-row + .uw-row {
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    margin-top: 5px;
    padding-top: 6px;
  }

  .uw-name { font-weight: 600; color: #ffffff; }
  .uw-role { font-size: 10px; font-weight: 700; background: #334155; color: #f8fafc; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.05em; }
  .uw-dropdown-body a { color: var(--primary-blue); text-decoration: none; font-weight: 500; }
  .uw-dropdown-body a:hover { text-decoration: underline; }

  .card-footer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 14px;
    margin-top: 4px;
    border-top: 1px solid var(--card-border);
  }

  .card-footer a {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary-blue);
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.15);
    padding: 7px 14px;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .card-footer a:hover {
    background: var(--primary-blue);
    color: #090d16;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  }

  /* NAICS Lookup Table Styles */
  .naics-table-container {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .naics-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .naics-table th {
    background: #0f172a;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 14px 18px;
    border-bottom: 1px solid var(--card-border);
  }

  .naics-table td {
    padding: 13px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 13px;
    vertical-align: middle;
  }

  .naics-table tr:hover td {
    background: rgba(56, 189, 248, 0.04);
  }

  .naics-code-badge {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 13px;
    color: var(--primary-blue);
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 4px 9px;
    border-radius: 6px;
    display: inline-block;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .naics-code-badge:hover {
    background: var(--primary-blue);
    color: #090d16;
  }

  .sector-pill {
    font-size: 11px;
    font-weight: 600;
    color: #cbd5e1;
    background: #1e293b;
    padding: 3px 9px;
    border-radius: 6px;
    display: inline-block;
  }

  .find-carrier-btn {
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fbbf24;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .find-carrier-btn:hover {
    background: #f59e0b;
    color: #090d16;
  }

  .fallback-notice {
    grid-column: 1 / -1;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fcd34d;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: var(--text-secondary);
    font-size: 15px;
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--card-border);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Agency Carrier &amp; Broker Appetite Engine</h1>
      <p class="sub">Targeted Underwriting Markets &amp; Precise Class Code Mapping</p>
    </div>
    <div class="header-stats" id="statsCounter">17 Active Markets</div>
  </header>

  <div class="nav-tabs">
    <button type="button" class="tab-btn active" id="tabBtnCarriers" onclick="switchTab('carriers')">
      Carrier Appetite Directory <span class="tab-pill">17</span>
    </button>
    <button type="button" class="tab-btn" id="tabBtnNaics" onclick="switchTab('naics')">
      NAICS Class Code Finder <span class="tab-pill" id="naicsTotalPill">2100</span>
    </button>
    <button type="button" class="tab-btn" id="tabBtnAcord" onclick="switchTab('acord')">
      ACORD Forms <span class="tab-pill" id="acordTotalPill">923</span>
    </button>
  </div>

  <!-- TAB 1: CARRIERS & BROKERS -->
  <div id="tabCarriers" class="tab-section active">
    <div class="search-bar-wrapper">
      <input type="text" id="searchInput" placeholder="Search any NAICS code, class, or underwriter..." onkeyup="filterCards()">
      <select id="typeFilter" onchange="filterCards()">
        <option value="all">All Markets (17)</option>
        <option value="Carrier">Direct Carriers (15)</option>
        <option value="Broker">Wholesale Brokers (2)</option>
      </select>
    </div>

    <div id="suppressedBannerContainer"></div>
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- TAB 2: NAICS CLASS CODE FINDER -->
  <div id="tabNaics" class="tab-section">
    <div class="search-bar-wrapper">
      <input type="text" id="naicsSearchInput" placeholder="Search NAICS codes, groups, subsectors, or titles..." onkeyup="filterNaics()">
      <select id="naicsSectorFilter" onchange="filterNaics()">
        <option value="all">All Industry Sectors &amp; Hierarchies</option>
        <option value="11 - Agriculture, Forestry, Fishing and Hunting">11 - Agriculture, Forestry, Fishing &amp; Hunting</option>
        <option value="21 - Mining, Quarrying, and Oil and Gas Extraction">21 - Mining &amp; Oil/Gas Extraction</option>
        <option value="22 - Utilities">22 - Utilities</option>
        <option value="23 - Construction">23 - Construction</option>
        <option value="31-33 - Manufacturing">31-33 - Manufacturing</option>
        <option value="42 - Wholesale Trade">42 - Wholesale Trade</option>
        <option value="44-45 - Retail Trade">44-45 - Retail Trade</option>
        <option value="48-49 - Transportation and Warehousing">48-49 - Transportation &amp; Warehousing</option>
        <option value="51 - Information">51 - Information</option>
        <option value="52 - Finance and Insurance">52 - Finance &amp; Insurance</option>
        <option value="53 - Real Estate and Rental and Leasing">53 - Real Estate &amp; Leasing</option>
        <option value="54 - Professional, Scientific, and Technical Services">54 - Professional, Scientific &amp; Tech</option>
        <option value="55 - Management of Companies and Enterprises">55 - Management of Companies</option>
        <option value="56 - Administrative and Support and Waste Management">56 - Admin, Support &amp; Waste Mgmt</option>
        <option value="61 - Educational Services">61 - Educational Services</option>
        <option value="62 - Health Care and Social Assistance">62 - Health Care &amp; Social Assistance</option>
        <option value="71 - Arts, Entertainment, and Recreation">71 - Arts, Entertainment &amp; Recreation</option>
        <option value="72 - Accommodation and Food Services">72 - Accommodation &amp; Food Services</option>
        <option value="81 - Other Services (except Public Administration)">81 - Other Services</option>
        <option value="92 - Public Administration">92 - Public Administration</option>
      </select>
    </div>

    <div class="naics-table-container">
      <table class="naics-table">
        <thead>
          <tr>
            <th style="width: 140px;">NAICS Node</th>
            <th style="width: 230px;">Sector / Level</th>
            <th style="width: 260px;">Classification Title</th>
            <th>Hierarchical Description &amp; Scope</th>
            <th style="width: 135px;">Carrier Match</th>
          </tr>
        </thead>
        <tbody id="naicsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 3: ACORD FORMS (923 FORMS) -->
  <div id="tabAcord" class="tab-section">
    <div class="search-bar-wrapper">
      <input type="text" id="acordSearchInput" placeholder="Search ACORD forms by number, edition, category, or title..." onkeyup="filterAcord()">
      <select id="acordCategoryFilter" onchange="filterAcord()">
        <option value="all">All ACORD Categories (923)</option>
        <option value="Commercial Applications">Commercial Applications</option>
        <option value="Commercial Supplements">Commercial Supplements</option>
        <option value="Certificates & Evidence">Certificates &amp; Evidence</option>
        <option value="Personal Lines">Personal Lines</option>
        <option value="Policy Service & Binders">Policy Service &amp; Binders</option>
        <option value="Loss Notices & Claims">Loss Notices &amp; Claims</option>
        <option value="Workers Compensation">Workers Compensation</option>
        <option value="Auto ID & Financial Resp.">Auto ID &amp; Financial Resp.</option>
        <option value="Farm & Agribusiness">Farm &amp; Agribusiness</option>
        <option value="Surety & Fidelity">Surety &amp; Fidelity</option>
        <option value="Aviation & Marine">Aviation &amp; Marine</option>
        <option value="Employee Benefits & Group">Employee Benefits &amp; Group</option>
      </select>
    </div>

    <div class="naics-table-container">
      <table class="naics-table">
        <thead>
          <tr>
            <th style="width: 150px;">Form Number</th>
            <th style="width: 115px;">Edition</th>
            <th style="width: 220px;">Category</th>
            <th style="width: 300px;">Form Title</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="acordTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

function getMarketDisplayClasses(m) {
  const fromNaics = (m.naicsWritten || []).map(code => ({
    code: code,
    label: naicsLookup[code] || "Specialty Class / Sector",
    fullText: `${code} - ${naicsLookup[code] || "Specialty Class / Sector"}`
  }));
  const fromExtra = (m.extraClasses || []).map(txt => ({
    code: null,
    label: txt,
    fullText: txt
  }));
  return [...fromNaics, ...fromExtra];
}

function switchTab(tabName) {
  const tabCarriers = document.getElementById("tabCarriers");
  const tabNaics = document.getElementById("tabNaics");
  const tabAcord = document.getElementById("tabAcord");
  const btnCarriers = document.getElementById("tabBtnCarriers");
  const btnNaics = document.getElementById("tabBtnNaics");
  const btnAcord = document.getElementById("tabBtnAcord");

  tabCarriers.classList.remove("active");
  tabNaics.classList.remove("active");
  tabAcord.classList.remove("active");
  btnCarriers.classList.remove("active");
  btnNaics.classList.remove("active");
  btnAcord.classList.remove("active");

  if (tabName === "carriers") {
    tabCarriers.classList.add("active");
    btnCarriers.classList.add("active");
    filterCards();
  } else if (tabName === "naics") {
    tabNaics.classList.add("active");
    btnNaics.classList.add("active");
    filterNaics();
  } else if (tabName === "acord") {
    tabAcord.classList.add("active");
    btnAcord.classList.add("active");
    filterAcord();
  }
}

function searchCarrierFromNaics(code) {
  switchTab("carriers");
  const input = document.getElementById("searchInput");
  input.value = code;
  filterCards();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function copyCode(el, code) {
  navigator.clipboard.writeText(code);
  const original = el.innerText;
  el.innerText = "Copied!";
  setTimeout(() => { el.innerText = original; }, 900);
}

function renderNaics(list) {
  const tbody = document.getElementById("naicsTableBody");
  document.getElementById("statsCounter").innerText = `${list.length} NAICS Nodes Listed`;
  document.getElementById("naicsTotalPill").innerText = naicsCodes.length;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:45px; color:#94a3b8;">No matching NAICS codes found. Try searching another code or keyword.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(item => {
    const matchCount = markets.filter(m => (m.naicsWritten || []).includes(item.code)).length;
    return `
      <tr>
        <td><span class="naics-code-badge" title="Click to copy code" onclick="copyCode(this, '${item.code}')">${item.code}</span></td>
        <td><span class="sector-pill">${item.sector}</span></td>
        <td style="font-weight: 600; color: #f8fafc;">${item.title}</td>
        <td style="color: #94a3b8;">${item.desc}</td>
        <td>
          <button type="button" class="find-carrier-btn" onclick="searchCarrierFromNaics('${item.code}')">
            ${matchCount} Markets &rarr;
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

function filterNaics() {
  const q = document.getElementById("naicsSearchInput").value.toLowerCase().trim();
  const sector = document.getElementById("naicsSectorFilter").value;

  const filtered = naicsCodes.filter(item => {
    const matchesSector = sector === "all" || item.sector === sector;
    if (!matchesSector) return false;
    if (q === "") return true;

    const text = `${item.code} ${item.sector} ${item.title} ${item.desc}`.toLowerCase();
    return text.includes(q);
  });

  renderNaics(filtered);
}

function toggleUwDropdown(id) {
  const body = document.getElementById(id);
  if (body) {
    body.classList.toggle("open");
  }
}

function render(list, isFallback = false, suppressedNames = [], query = "") {
  const grid = document.getElementById("cardGrid");
  const bannerContainer = document.getElementById("suppressedBannerContainer");
  document.getElementById("statsCounter").innerText = `${isFallback ? 2 : list.length} Active Markets Displayed`;

  if (suppressedNames.length > 0) {
    bannerContainer.innerHTML = `
      <div class="suppressed-banner">
        <span><strong>Hidden by Guidelines (${suppressedNames.length}):</strong> ${suppressedNames.join(", ")}</span>
        <span>Showing only markets whose guidelines fit this search</span>
      </div>
    `;
  } else {
    bannerContainer.innerHTML = "";
  }
  
  if (list.length === 0 && !isFallback) {
    grid.innerHTML = `<div class="no-results">No matching underwriting markets found. Try another search term.</div>`;
    return;
  }

  let html = "";
  if (isFallback) {
    html += `<div class="fallback-notice">⚠️ Zero direct matches found in standard admitted markets. Automatically surfacing wholesale E&amp;S broker desks (XPT &amp; Arlington/Roe) below:</div>`;
  }
  
  html += list.map((m, idx) => {
    const customLinks = (m.links || []).map(l =>
      `<a href="${l.url}" target="_blank">${l.label} &rarr;</a>`
    ).join("");

    const displayClasses = getMarketDisplayClasses(m);
    let classesHtml = "";
    if (displayClasses.length > 0) {
      const classPanelId = `class-panel-${idx}`;
      const classSearchMatched = query !== "" && displayClasses.some(c => c.fullText.toLowerCase().includes(query));

      classesHtml = `
        <div class="uw-dropdown">
          <button type="button" class="uw-dropdown-toggle" onclick="toggleUwDropdown('${classPanelId}')">
            <span>NAICS &amp; Classes Written</span>
            <span class="uw-count-pill">${displayClasses.length} &#9662;</span>
          </button>
          <div class="uw-dropdown-body ${classSearchMatched ? 'open' : ''}" id="${classPanelId}">
            <div class="class-tags-wrap">
              ${displayClasses.map(c => {
                const isMatch = query !== "" && c.fullText.toLowerCase().includes(query);
                if (c.code) {
                  return `<span class="class-tag ${isMatch ? 'matched' : ''}"><code>${c.code}</code> - ${c.label}</span>`;
                }
                return `<span class="class-tag ${isMatch ? 'matched' : ''}">${c.label}</span>`;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    let uwHtml = "";
    if (m.underwriters && m.underwriters.length > 0) {
      const panelId = `uw-panel-${idx}`;
      const uwSearchMatched = query !== "" && m.underwriters.some(u =>
        `${u.name} ${u.role || ''} ${u.phone || ''} ${u.ext || ''} ${u.email || ''}`.toLowerCase().includes(query)
      );

      uwHtml = `
        <div class="uw-dropdown">
          <button type="button" class="uw-dropdown-toggle" onclick="toggleUwDropdown('${panelId}')">
            <span>Underwriters</span>
            <span class="uw-count-pill">${m.underwriters.length} &#9662;</span>
          </button>
          <div class="uw-dropdown-body ${uwSearchMatched ? 'open' : ''}" id="${panelId}">
            ${m.underwriters.map(u => {
              const phonePart = u.phone ? `${u.phone}${u.ext ? ' x' + u.ext : ''}` : '';
              const emailPart = u.email ? `<a href="mailto:${u.email}">${u.email}</a>` : '';
              const details = [phonePart, emailPart].filter(Boolean).join(' &bull; ');
              return `
                <div class="uw-row">
                  <span class="uw-name">${u.name}</span>
                  ${u.role ? `<span class="uw-role">${u.role}</span>` : ''}
                  ${details ? `<span>${details}</span>` : ''}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    return `
      <div class="card">
        <div>
          <div class="card-top">
            <h2 class="carrier-title">${m.name}</h2>
            <span class="badge ${m.type === 'Broker' ? 'badge-broker' : 'badge-carrier'}">${m.type}</span>
          </div>
          <div class="lines-text"><strong>Lines:</strong> ${m.lines}</div>
          ${classesHtml}
          ${uwHtml}
        </div>
        <div class="card-footer">
          ${customLinks}
        </div>
      </div>
    `;
  }).join("");
  
  grid.innerHTML = html;
}

function filterCards() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const type = document.getElementById("typeFilter").value;
  const suppressedNames = [];

  const triggeredTags = new Set();
  if (q !== "") {
    searchKnockoutTriggers.forEach(trigger => {
      if (trigger.terms.some(term => q.includes(term))) {
        triggeredTags.add(trigger.tag);
      }
    });
  }
  
  const filtered = markets.filter(m => {
    const matchesType = type === "all" || m.type === type;
    if (!matchesType) return false;

    if (triggeredTags.size > 0 && m.knockouts && m.knockouts.length > 0) {
      const isKnockedOut = [...triggeredTags].some(tag => m.knockouts.includes(tag));
      if (isKnockedOut) {
        suppressedNames.push(m.name);
        return false;
      }
    }

    if (q === "") return true;

    const linkLabels = (m.links || []).map(l => l.label).join(" ");
    const uwText = (m.underwriters || []).map(u => `${u.name} ${u.role || ''} ${u.phone || ''} ${u.ext || ''} ${u.email || ''}`).join(" ");
    const classesText = getMarketDisplayClasses(m).map(c => c.fullText).join(" ");
    const text = `${m.name} ${m.lines} ${m.sweetSpot} ${classesText} ${linkLabels} ${uwText}`.toLowerCase();

    if (triggeredTags.size > 0) {
      return text.includes(q) || m.type === "Broker";
    }

    return text.includes(q);
  });

  if (filtered.length === 0 && q !== "" && type !== "Carrier") {
    const fallbackBrokers = markets.filter(m => m.type === "Broker");
    render(fallbackBrokers, true, suppressedNames, q);
  } else {
    render(filtered, false, suppressedNames, q);
  }
}

function renderAcord(list) {
  const tbody = document.getElementById("acordTableBody");
  document.getElementById("statsCounter").innerText = `${list.length} ACORD Forms Listed`;
  document.getElementById("acordTotalPill").innerText = acordForms.length;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:45px; color:#94a3b8;">No matching ACORD forms found.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(f => `
    <tr>
      <td><span class="naics-code-badge" title="Click to copy form number" onclick="copyCode(this, '${f.code}')">${f.code}</span></td>
      <td style="font-family: 'Courier New', monospace; color: #94a3b8; font-weight: 600;">${f.ed}</td>
      <td><span class="sector-pill">${f.cat}</span></td>
      <td style="font-weight: 600; color: #f8fafc;">${f.title}</td>
      <td style="color: #94a3b8;">${f.desc}</td>
    </tr>
  `).join("");
}

function filterAcord() {
  const q = document.getElementById("acordSearchInput").value.toLowerCase().trim();
  const cat = document.getElementById("acordCategoryFilter").value;

  const filtered = acordForms.filter(f => {
    const matchesCat = cat === "all" || f.cat === cat;
    if (!matchesCat) return false;
    if (q === "") return true;
    return `${f.code} ${f.ed} ${f.cat} ${f.title} ${f.desc}`.toLowerCase().includes(q);
  });

  renderAcord(filtered);
}

render(markets);
renderNaics(naicsCodes);
